name: llama-server on Aurora OS x86_64

on:
  push:
    branches: [feature/9-llama-cpp-aurora-feasibility]
    paths: [.github/workflows/llama-server-emulator.yml]

permissions:
  actions: read
  contents: read

jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download verified SDK BT build
        uses: actions/download-artifact@v4
        with:
          name: llama-server-aurora-bt-x86_64
          run-id: 44597230350
          github-token: ${{ github.token }}

      - name: Prepare Aurora OS 5.2.1.200 emulator and model
        run: |
          set -euo pipefail
          tar -xzf llama-server-aurora-x86_64.tar.gz
          curl -fLsS --retry 3 https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories260K.gguf -o stories260K.gguf
          echo '047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  stories260K.gguf' | sha256sum -c -
          curl -fLsS --retry 3 https://sdk-repo.omprussia.ru/sdk/installers/5.2.1/5.2.1.200-release/AuroraEmulator/standalone-emulator-5.2.1.200-linux-x86_64.7z -o emulator.7z
          echo '33c55d3d40488b246f9ac07a184548ad  emulator.7z' | md5sum -c -
          7z x -bd -o"$RUNNER_TEMP/aurora" emulator.7z
          find "$RUNNER_TEMP/aurora" -name adt -o -name emulator-setup.ini -o -name '*.qcow2'

      - name: Generate text inside the emulator
        run: |
          set -euo pipefail
          disk="$RUNNER_TEMP/aurora/emulators/5.2.1.200/Aurora_OS-5.2.1.200-Emulator_x86_64.qcow2"
          qemu=$(find "$RUNNER_TEMP/aurora" -name qemu-system-x86_64 -executable -print -quit)
          test -f "$disk"
          test -n "$qemu"
          lab="$RUNNER_TEMP/llama-emulator"
          mkdir -p "$lab"/{ssh/defaultuser,configs,media}
          ssh-keygen -q -t ed25519 -N '' -f "$lab/key"
          cp "$lab/key.pub" "$lab/ssh/defaultuser/authorized_keys"

          if test -c /dev/kvm && ! test -w /dev/kvm; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi
          accelerator=(-accel tcg,thread=multi -cpu max)
          if test -w /dev/kvm; then accelerator=(-accel kvm -cpu host); fi
          "$qemu" "${accelerator[@]}" -m 3072 -smp 2 -display none -no-reboot -snapshot \
            -drive "file=$disk,if=virtio,format=qcow2" \
            -nic user,model=e1000,hostfwd=tcp:127.0.0.1:2223-:22 \
            -virtfs "local,path=$lab/ssh,mount_tag=ssh,security_model=none,readonly=on" \
            -virtfs "local,path=$lab/configs,mount_tag=configs,security_model=none,readonly=on" \
            -virtfs "local,path=$lab/media,mount_tag=media,security_model=none,readonly=on" \
            -serial "file:$lab/console.log" > "$lab/qemu.log" 2>&1 &
          qemu_pid=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              cat "$lab/qemu.log"
              tail -80 "$lab/console.log"
            fi
            kill "$qemu_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          connection=(-o BatchMode=yes -o ConnectTimeout=4 -o StrictHostKeyChecking=accept-new
            -o "UserKnownHostsFile=$lab/known_hosts" -i "$lab/key")
          guest=defaultuser@127.0.0.1
          for attempt in {1..30}; do
            if ssh "${connection[@]}" -p 2223 "$guest" true 2>/dev/null; then break; fi
            kill -0 "$qemu_pid" || { cat "$lab/qemu.log" >&2; exit 1; }
            sleep 3
          done
          ssh "${connection[@]}" -p 2223 "$guest" uname -m | grep -x x86_64
          ssh "${connection[@]}" -p 2223 "$guest" cat /etc/os-release | grep '^VERSION_ID=5.2.1.200$'
          scp -O "${connection[@]}" -P 2223 llama-server stories260K.gguf "$guest:"
          cat > llama-smoke.sh <<'SMOKE'
          set -euo pipefail
          cd "$HOME"
          chmod +x ./llama-server
          ./llama-server -m stories260K.gguf -c 256 -t 2 -ngl 0 --host 127.0.0.1 --port 19090 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          until curl -fsS --max-time 2 http://127.0.0.1:19090/health; do
            kill -0 "$server_pid" || { cat server.log >&2; exit 1; }
            sleep 1
          done
          curl -fsS --max-time 90 -H 'Content-Type: application/json' \
            -d '{"prompt":"Once upon a time","n_predict":12,"temperature":0,"seed":42}' \
            http://127.0.0.1:19090/completion > completion.json
          SMOKE
          timeout 150 ssh "${connection[@]}" -p 2223 "$guest" 'bash -s' < llama-smoke.sh
          scp -O "${connection[@]}" -P 2223 "$guest:completion.json" completion.json
          jq -er '.content | select(type == "string" and test("\\S"))' completion.json
