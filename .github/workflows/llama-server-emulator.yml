name: llama-server on Aurora OS x86_64

on:
  push:
    branches: [feature/9-llama-cpp-aurora-feasibility]
    paths: [.github/workflows/llama-server-emulator.yml]

permissions:
  actions: read
  contents: read

jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download verified SDK BT build
        uses: actions/download-artifact@v4
        with:
          name: llama-server-aurora-bt-x86_64
          run-id: 44597230350
          github-token: ${{ github.token }}

      - name: Prepare Aurora OS 5.2.1.200 emulator and model
        run: |
          set -euo pipefail
          tar -xzf llama-server-aurora-x86_64.tar.gz
          curl -fLsS --retry 3 https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories260K.gguf -o stories260K.gguf
          echo '047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  stories260K.gguf' | sha256sum -c -
          curl -fLsS --retry 3 https://sdk-repo.omprussia.ru/sdk/installers/5.2.1/5.2.1.200-release/AuroraEmulator/standalone-emulator-5.2.1.200-linux-x86_64.7z -o emulator.7z
          echo '33c55d3d40488b246f9ac07a184548ad  emulator.7z' | md5sum -c -
          7z x -bd -o"$RUNNER_TEMP/aurora" emulator.7z
          find "$RUNNER_TEMP/aurora" -name adt -o -name emulator-setup.ini -o -name '*.qcow2'

      - name: Generate text inside the emulator
        run: |
          set -euo pipefail
          disk="$RUNNER_TEMP/aurora/emulators/5.2.1.200/Aurora_OS-5.2.1.200-Emulator_x86_64.qcow2"
          qemu=$(find "$RUNNER_TEMP/aurora" -name qemu-system-x86_64 -executable -print -quit)
          lab="$RUNNER_TEMP/llama-emulator"
          mkdir -p "$lab/rootfs" "$lab"/{configs,media,ssh}
          "$(dirname "$qemu")/qemu-img" convert -O raw "$disk" "$lab/disk.raw"
          offset=$(sfdisk --json "$lab/disk.raw" | jq -er '.partitiontable | .partitions[0].start * .sectorsize')

          # Attach a smoke test to the disposable guest disk and return its result over serial.
          cat > "$lab/llama-smoke.sh" <<'SMOKE'
          #!/bin/bash
          set -euo pipefail
          test "$(uname -m)" = x86_64
          grep '^VERSION_ID=5.2.1.200$' /etc/os-release
          cd /opt/aurora-llama-test
          ./llama-server -m stories260K.gguf -c 256 -t 2 -ngl 0 --host 127.0.0.1 --port 19090 > /tmp/aurora-llama.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:19090/health; then ready=1; break; fi
            if ! kill -0 "$server_pid"; then break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then cat /tmp/aurora-llama.log >&2; exit 1; fi
          printf '\nCOMPLETION '
          curl -fsS --max-time 90 -H 'Content-Type: application/json' \
            -d '{"prompt":"Once upon a time","n_predict":12,"temperature":0,"seed":42}' \
            http://127.0.0.1:19090/completion
          printf '\n'
          SMOKE
          cat > "$lab/llama-smoke.service" <<'SERVICE'
          [Unit]
          Description=Aurora llama-server feasibility check
          After=local-fs.target

          [Service]
          Type=oneshot
          User=defaultuser
          ExecStart=/opt/aurora-llama-test/llama-smoke.sh
          StandardOutput=tty
          StandardError=tty
          TTYPath=/dev/ttyS0

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo mount -o "loop,offset=$offset" "$lab/disk.raw" "$lab/rootfs"
          trap 'sudo umount "$lab/rootfs"' EXIT
          sudo install -d "$lab/rootfs/opt/aurora-llama-test"
          sudo install -m 0755 llama-server "$lab/llama-smoke.sh" "$lab/rootfs/opt/aurora-llama-test/"
          sudo install -m 0644 stories260K.gguf "$lab/rootfs/opt/aurora-llama-test/"
          sudo install -m 0644 "$lab/llama-smoke.service" "$lab/rootfs/etc/systemd/system/"
          sudo mkdir -p "$lab/rootfs/etc/systemd/system/multi-user.target.wants"
          sudo ln -s ../llama-smoke.service "$lab/rootfs/etc/systemd/system/multi-user.target.wants/llama-smoke.service"
          sudo cat "$lab/rootfs/etc/fstab" | tee "$lab/fstab.log"
          sudo umount "$lab/rootfs"
          trap - EXIT

          if test -c /dev/kvm && ! test -w /dev/kvm; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi
          accelerator=(-accel tcg,thread=multi -cpu max)
          if test -w /dev/kvm; then accelerator=(-accel kvm -cpu host); fi
          "$qemu" "${accelerator[@]}" -m 3072 -smp 2 -display none -no-reboot -snapshot \
            -vga none -device virtio-gpu,xres=360,yres=800 \
            -drive "file=$lab/disk.raw,if=virtio,format=raw" \
            -nic user,model=virtio-net-pci,mac=52:54:00:12:34:56,restrict=on \
            -virtfs "local,path=$lab/ssh,mount_tag=ssh,security_model=mapped,readonly=on" \
            -virtfs "local,path=$lab/configs,mount_tag=configs,security_model=mapped,readonly=on" \
            -virtfs "local,path=$lab/media,mount_tag=media,security_model=mapped,readonly=on" \
            -serial "file:$lab/console.log" > "$lab/qemu.log" 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if grep -q '^COMPLETION .*}' "$lab/console.log"; then break; fi
            if ! kill -0 "$qemu_pid"; then break; fi
            sleep 3
          done
          cat "$lab/qemu.log" "$lab/console.log"
          tr -d '\r' < "$lab/console.log" | sed -n 's/^COMPLETION //p' |
            jq -e -s 'any(.[]; (.content | type == "string" and test("\\S")) and .tokens_predicted > 0)'

      - name: Upload boot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-x86_64-boot-diagnostics
          path: ${{ runner.temp }}/llama-emulator/*.log
